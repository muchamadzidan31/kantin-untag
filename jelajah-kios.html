<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>Jelajah Kios - Kantin UNTAG Surabaya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/images/logo-kantin.png">
</head>
<body>
  <header class="navbar-kantin d-flex align-items-center">
    <div class="desktop-container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-4">
        <a href="beranda.html" class="d-flex align-items-center gap-2 text-decoration-none text-dark">
          <img src="assets/icons/logo-kantin.svg" alt="Logo Kantin UNTAG" width="40" height="40">
          <span class="fw-bold fs-5">Kantin UNTAG</span>
        </a>
        <nav class="d-flex align-items-center gap-2">
          <a href="beranda.html" class="nav-link-kantin ">Beranda</a>
          <a href="jelajah-kios.html" class="nav-link-kantin active">Jelajah Kios</a>
          <a href="status-pesanan.html" class="nav-link-kantin ">Status Pesanan</a>
          <a href="riwayat-pesanan.html" class="nav-link-kantin ">Riwayat</a>
        </nav>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a href="keranjang.html" class="btn btn-kantin-outline position-relative ">
          <i class="fa-solid fa-bag-shopping me-2"></i>Keranjang
          <span class="badge rounded-pill ms-1" style="background: var(--green-900);" id="navCartCount">2</span>
        </a>
        <div class="d-flex align-items-center gap-2 ps-2 border-start">
          <div class="rounded-circle fw-bold d-flex align-items-center justify-content-center navbar-user-initials" style="width:36px;height:36px;background:var(--green-100);color:var(--green-900);">MZ</div>
          <div class="small">
            <div class="fw-semibold navbar-user-name">Muchamad Zidan</div>
            <div class="text-secondary navbar-user-id" style="font-size:11px;">1462400178</div>
          </div>
          <a href="login.html" class="btn btn-sm btn-kantin-outline ms-2" title="Keluar"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
      </div>
    </div>
  </header>
  <main class="desktop-container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="fw-bold fs-3 mb-1">Jelajah Kios Kantin UNTAG</h1><p class="text-secondary mb-0">Temukan kios makanan dan minuman yang sedang beroperasi di area kantin utama.</p></div>
      <div class="d-flex align-items-center gap-2"><span class="small text-secondary">Simulasi State:</span><select id="jelajahStateSelector" class="form-select form-select-sm input-kantin py-1" style="width: 220px;"><option value="normal">03.01 - Jelajah Kios (Normal)</option><option value="loading">03.02 - Jelajah Kios (Memuat)</option><option value="empty">03.03 - Jelajah Kios (Kosong)</option><option value="error">03.04 - Jelajah Kios (Gagal)</option></select></div>
    </div>
    <div class="card-kantin p-3 mb-4 d-flex justify-content-between align-items-center">
      <div class="d-flex gap-2">
        <button class="btn btn-kantin-primary btn-sm rounded-pill px-3 jelajah-filter-btn" data-filter="Semua">Semua Kios (8)</button>
        <button class="btn btn-kantin-outline btn-sm rounded-pill px-3 jelajah-filter-btn" data-filter="Makanan Berat">Makanan Berat</button>
        <button class="btn btn-kantin-outline btn-sm rounded-pill px-3 jelajah-filter-btn" data-filter="Berkuah & Mie">Berkuah &amp; Mie</button>
        <button class="btn btn-kantin-outline btn-sm rounded-pill px-3 jelajah-filter-btn" data-filter="Minuman & Kopi">Minuman &amp; Kopi</button>
        <button class="btn btn-kantin-outline btn-sm rounded-pill px-3 jelajah-filter-btn" data-filter="Buka">Buka Sekarang</button>
      </div>
      <div class="input-group" style="width: 300px;"><span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-secondary"></i></span><input type="text" id="searchKiosInput" class="form-control form-control-sm input-kantin border-start-0" placeholder="Cari nama kios atau menu..."></div>
    </div>
    <div id="jelajahContentContainer"></div>
  </main>
  <script src="js/script.js"></script>
</body></html>
